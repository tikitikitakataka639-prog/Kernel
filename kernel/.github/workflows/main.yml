name: KERNEL Web - Tests y compilación Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validar KERNEL Web
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Comprobar sintaxis Python del Police Engine
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compilar sintaxis Python
        run: python -m compileall -q police-engine/src police-engine/tests

      - name: Instalar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Instalar dependencias
        run: npm install

      # Los tests no dependen del routeTree generado por Vite.
      - name: Ejecutar tests
        run: bun test

      - name: Auditoría previa de configuración Vercel
        run: bun run preflight:vercel

      # El preset se fija en vite.config.ts cuando VERCEL=1.
      # El plugin de TanStack Router regenera src/routeTree.gen.ts.
      - name: Compilar para Vercel (genera routeTree.gen.ts y .vercel/output)
        run: npm run build
        env:
          VERCEL: "1"

      - name: Verificar Vercel Output v3 y tamaño de Function
        run: bun run verify:vercel-output

      # TypeScript después del build para tipar el árbol de rutas actualizado
      # (incluye /laboratorio-nativo y el resto de file routes).
      - name: Comprobar TypeScript
        run: bunx tsc --noEmit

  police-engine:
    name: Validar Police Engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependencias del Police Engine
        run: python -m pip install pytest numpy onnxruntime tokenizers scikit-learn==1.9.1 joblib huggingface_hub
      - name: Auditar particiones del corpus Grooming
        working-directory: police-engine
        run: python scripts/audit_grooming_dataset.py
      - name: Comprobar abstención en casos ambiguos sintéticos
        working-directory: police-engine
        run: python scripts/eval_ambiguous_challenge.py
      - name: Ejecutar pruebas del Police Engine
        run: python -m pytest police-engine/tests -v
